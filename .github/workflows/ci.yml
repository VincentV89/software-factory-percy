# Percy CI: the same gates the build runtime runs (README "Commands"), plus the primary browser
# journey E2E-01 against the in-memory local server. No AWS credentials are used or needed here.
# Deploying to AWS is not automated yet; see docs/runbooks/deploy.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  CI: 'true'

jobs:
  check:
    name: check (lint, types, unit + integration, arch, CDK tests, synth, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # eslint, tsc, vitest (+80% domain coverage), dependency-cruiser, CDK assertion and
      # architecture tests with cdk-nag, cdk synth (to /tmp/percy-cdk.out), secretlint.
      - run: npm run check
      # Blocking dependency gate: no critical advisories in runtime (shipped) dependencies.
      - name: npm audit (runtime deps, fail on critical)
        run: npm audit --omit=dev --audit-level=critical
      # Full report including dev tooling; informational until the known findings are resolved.
      - name: npm audit (all deps, report only)
        run: npm audit --audit-level=high || echo "::warning title=npm audit::high or critical advisories present; see the log"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e-local:
    name: e2e (E2E-01, Playwright Chromium, local server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      # The Playwright webServer builds the SPA and starts apps/local/src/server.ts on :4173.
      - run: npm run e2e:local
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: /tmp/percy-playwright-results/
          if-no-files-found: ignore
          retention-days: 7
